[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "car-narc"
version = "0.1.0"
description = "Roadside license plate recognition for a Raspberry Pi 5, tuned for plate accuracy."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "opencv-python-headless",
    "pyyaml",
    "fastapi",
    "uvicorn",
    "fast-plate-ocr[onnx]",
    "open-image-models[onnx]",
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[project.scripts]
carnarc = "carnarc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: needs model downloads (run with: pytest -m slow)",
]
addopts = "-m 'not slow'"
